# Starts the homelab dashboard 90 s after the Kindle UI is up, if /mnt/us/serverdash/autostart exists.
# Installed by documents/"Server Dashboard Autostart.sh"; remove /etc/upstart/serverdash.conf to uninstall.
start on started framework
task
script
    [ -f /mnt/us/serverdash/autostart ] || exit 0
    # In the background, so the boot never waits on us; the 90 s leave time to plug in and fix things.
    nohup sh -c 'sleep 90; [ -f /mnt/us/serverdash/autostart ] && sh "/mnt/us/documents/Server Dashboard.sh"' > /dev/null 2>&1 &
end script
